name: App CI (central)
# Reusable workflow for every app repository (host, remotes, registry) — the GitHub counterpart of an Azure DevOps
# `extends: template`. Callers stay thin and pin a version (`@v2`); the pipeline is changed in one place.
# The caller must grant `packages: read`, and its repository must have read access to the @portal-poc packages.
#
# Checks only. Nothing deploys by itself: developers press "Deploy" (deploy.yml) and pick the stand and the ref.
on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # pnpm does not expand env vars in repository .npmrc credentials: auth goes to the user-level config.
      - name: Authenticate to GitHub Packages (@portal-poc)
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present lint
      - run: pnpm run --if-present test
      - run: pnpm run --if-present build
      - name: Integration contract (portal-cli verify)
        run: pnpm run --if-present verify
      - name: Registry entries (portal-cli registry validate)
        run: pnpm run --if-present validate
      # Migrations are applied by developers (`portal-cli upgrade` / `migrate`, ADR 0028): CI only points them out.
      - name: Pending platform migrations (portal-cli migrate --check)
        run: |
          if ! pnpm dlx @portal-poc/cli@2 migrate --check > migrate-check.log 2>&1; then
            cat migrate-check.log
            echo "::warning title=Platform migrations pending::Run \`pnpm dlx @portal-poc/cli@2 migrate\` (or \`upgrade\`), review the diff and commit. Details in this step's log."
          fi

