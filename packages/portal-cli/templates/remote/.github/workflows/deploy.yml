name: Deploy
# Pick the stand and the branch or tag, press "Run workflow". The stand rules (registry stands.json) are checked
# before anything is built: see README "Deploy".
on:
  workflow_dispatch:
    inputs:
      stand:
        description: Stand
        type: choice
        options: [dev3, dev2, dev1]
      ref:
        description: Branch or tag (develop, feature/…, release/1.5, v1.5.2)
        default: develop
      base-path:
        description: First deploy to this stand only — route in the host, e.g. /__NAME__
        required: false
      scopes:
        description: First deploy to this stand only — token scopes, comma-separated (as in public/config.json)
        required: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    uses: portal-poc/platform/.github/workflows/deploy.yml@v2
    with:
      stand: ${{ inputs.stand }}
      ref: ${{ inputs.ref }}
      base-path: ${{ inputs.base-path }}
      scopes: ${{ inputs.scopes }}
    secrets: inherit
