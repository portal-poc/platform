name: CI
on:
  push:
    branches: [main, develop, 'release/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  ci:
    # Central pipeline owned by the platform team (pinned version): checks; on develop / v* tags also publish + release.
    uses: portal-poc/platform/.github/workflows/app-ci.yml@v1
    secrets: inherit

  forward-merge:
    # A fix on release/X.Y must reach the newer lines and develop: opens the next forward-merge PR.
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: portal-poc/platform/.github/workflows/forward-merge.yml@v1
