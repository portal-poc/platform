name: CI
on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    # Central pipeline owned by the platform team (pinned version): checks only, deploys are manual (deploy.yml).
    uses: portal-poc/platform/.github/workflows/app-ci.yml@v2
    secrets: inherit

  forward-merge:
    # A fix on release/X.Y must reach the newer lines and develop: opens the next forward-merge PR.
    if: startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
      pull-requests: write
    uses: portal-poc/platform/.github/workflows/forward-merge.yml@v2
