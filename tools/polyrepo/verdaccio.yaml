# Local stand-in for Nexus. Internal scope is served ONLY locally (never proxied to npmjs: no dependency confusion);
# everything else is proxied from npmjs like a Nexus group repository.
storage: ../../.polyrepo/verdaccio-storage
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  '@portal-poc/*':
    access: $all
    publish: $anonymous
    unpublish: $anonymous
  '**':
    access: $all
    proxy: npmjs
listen: 0.0.0.0:4873
log: { type: stdout, format: pretty, level: warn }
